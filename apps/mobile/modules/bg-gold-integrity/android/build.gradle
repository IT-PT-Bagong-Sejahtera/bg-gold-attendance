plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bggold'
version = '0.1.0'

android {
  namespace "com.bggold.integrity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdk 23
  }
}

dependencies {
  implementation 'com.google.android.play:integrity:1.6.0'
}
